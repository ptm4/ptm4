name: Deploy opti Units

# Installs opti's systemd units + scripts from the repo, so they stop being
# hand-managed (until 2026-07-26 the installed units had silently drifted AHEAD of
# the repo copies — ZFS guards existed live but not in git; this workflow makes the
# repo authoritative in both directions).
#
# As of 2026-09-08 Peter's ptm4 working copy is E:\REPO\ptm4 on his Windows
# workstation — opti no longer has (and must not get) its own git checkout. Instead
# this workflow rsyncs the homelab/ tree from the runner's ephemeral checkout to a
# fixed, non-git snapshot directory (/srv/red/fs/ptm/repo/ptm4/homelab/) that the
# dispatcher, homelab-db, and the rpi webapp's read-only /workspace mount all still
# expect at that path. Nobody edits that directory and it has no .git — it's
# overwritten wholesale on every relevant push, same idiom as the cp steps below.
#
# Deliberately NOT deployed here:
#   - /etc/homelab/samba-red.conf — the webapp's samba editor drives the dispatcher's
#     validate→backup→write→reload→verify pipeline (hosts/opti/samba_config.py); a
#     blind cp + reload on every push would bypass those interlocks.
#   - /etc/hl-agents.env — secrets, never in the repo.

on:
  push:
    branches: [main]
    paths:
      - "homelab/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, opti]
    # 30, not 10: the headers step below may run a one-time zfs DKMS compile (a few minutes).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ZFS is out-of-tree (zfs-dkms), and DKMS can only build for a kernel whose headers
      # are installed. Only the linux-headers-amd64 METApackage makes headers follow every
      # new linux-image-amd64. Until 2026-11-09 opti had just the versioned
      # linux-headers-6.12.94, so the 2026-10-04 upgrade to 6.12.95 got no zfs module and
      # any reboot (or power blip) would have come up without pool red. This step makes
      # the metapackage part of opti's definition, and fails the deploy loudly if the kernel
      # GRUB boots next (GRUB_DEFAULT=0 = newest) still has no zfs module. A no-op once
      # the metapackage is in. Runs before the snapshot sync so the doctor's
      # "next kernel lacks zfs" check never sees a half-done deploy.
      - name: Kernel headers track the kernel (zfs DKMS)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          installed() { dpkg-query -W -f='${Status}' "$1" 2>/dev/null | grep -q 'install ok installed'; }
          if ! installed zfs-dkms; then
            echo "zfs-dkms not installed - nothing to do"; exit 0
          fi
          if ! installed linux-headers-amd64; then
            echo "Installing linux-headers-amd64; the DKMS hook builds zfs for the new kernel"
            sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 \
                 install -y -t bookworm-backports linux-headers-amd64
          fi
          # newest kernel that is actually bootable (has a vmlinuz) - leftover /lib/modules
          # dirs from purged kernels must not count
          next_kernel=$(for k in $(ls -1 /lib/modules); do if [ -e "/boot/vmlinuz-$k" ]; then echo "$k"; fi; done | sort -V | tail -1)
          if ! /usr/sbin/modinfo -k "$next_kernel" zfs >/dev/null 2>&1; then
            echo "::error::no zfs module for $next_kernel (the kernel opti boots next) - a reboot would come up without pool red"
            sudo /usr/sbin/dkms status || true
            exit 1
          fi
          echo "zfs module present for next-boot kernel $next_kernel"

      - name: Sync the homelab/ snapshot the dispatcher, homelab-db, and webapp read (plain directory, not a git repo)
        run: |
          sudo mkdir -p /srv/red/fs/ptm/repo/ptm4
          sudo chown ptm:users /srv/red/fs/ptm/repo/ptm4
          # agentic/generated/ is opti's own output (gen-agentic-docs.py, ingest.py) and is not
          # in git; excluded paths are never deleted by --delete, so a deploy leaves them alone.
          rsync -a --delete --exclude '/agentic/generated/' "$GITHUB_WORKSPACE/homelab/" /srv/red/fs/ptm/repo/ptm4/homelab/

      - name: Install cross-host automation scripts
        run: |
          sudo cp "$GITHUB_WORKSPACE/homelab/tools/automation/homelab-autoupdate.sh" /usr/local/bin/
          sudo cp "$GITHUB_WORKSPACE/homelab/tools/automation/homelab-autoreboot.sh" /usr/local/bin/
          sudo chmod +x /usr/local/bin/homelab-autoupdate.sh /usr/local/bin/homelab-autoreboot.sh

      - name: Install systemd units
        run: |
          sudo cp "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.service \
                  "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.timer \
                  /etc/systemd/system/
          sudo cp "$GITHUB_WORKSPACE"/homelab/tools/automation/*.service \
                  "$GITHUB_WORKSPACE"/homelab/tools/automation/*.timer \
                  /etc/systemd/system/
          # Drop-ins (<unit>.d/*.conf), e.g. docker.service.d/10-zfs.conf: Docker waits for the ZFS mounts.
          for d in "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.d; do if [ -d "$d" ]; then sudo install -D -m644 -t "/etc/systemd/system/$(basename "$d")" "$d"/*.conf; fi; done
          sudo systemctl daemon-reload

      # One automatic upgrade path only: homelab-autoupdate (honors the dashboard hold).
      # Turns Debian's unattended-upgrades off, overriding OMV's 98openmediavault-periodic-custom.
      - name: Install apt policy (unattended-upgrades off)
        run: |
          sudo install -m 0644 "$GITHUB_WORKSPACE/homelab/hosts/opti/apt/99homelab-no-unattended-upgrade" /etc/apt/apt.conf.d/
          apt-config dump | grep -qx 'APT::Periodic::Unattended-Upgrade "0";'

      # smartd as code (2026-11-09). OMV owns /etc/smartd.conf and, with SMART off in its UI,
      # stops smartmontools.service whenever it applies that config, so smartd runs as our own
      # hl-smartd.service (installed above; Conflicts= the stock unit) reading
      # /etc/homelab/smartd.conf. notify.py gets a boot-disk copy so a failing POOL disk can
      # still page. The config is validated before anything is installed: a bad one fails this
      # step and leaves the running smartd alone. Editing hl-smartd.service itself needs a
      # manual `systemctl restart hl-smartd` (this step only reloads on config changes).
      # Runbook: homelab/agentic/runbooks/12-opti-disk-alerting.md
      - name: Install smartd config + alert hook (hl-smartd)
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/homelab/hosts/opti/smartd"
          sudo /usr/sbin/smartd -q showtests -c "$src/smartd.conf" >/dev/null
          changed=0
          cmp -s "$src/smartd.conf" /etc/homelab/smartd.conf 2>/dev/null || changed=1
          sudo install -D -m 0644 -o root -g root "$src/smartd.conf" /etc/homelab/smartd.conf
          sudo install -m 0755 -o root -g root "$src/hl-smartd-alert.sh" /usr/local/bin/hl-smartd-alert.sh
          sudo install -D -m 0644 -o root -g root "$GITHUB_WORKSPACE/homelab/tools/notify.py" /usr/local/lib/homelab/notify.py
          sudo systemctl disable smartmontools.service 2>/dev/null || true
          sudo systemctl enable hl-smartd.service
          if ! systemctl is-active --quiet hl-smartd.service; then
            sudo systemctl start hl-smartd.service
          elif [ "$changed" = 1 ]; then
            sudo systemctl reload hl-smartd.service
          fi
          sleep 3
          systemctl is-active hl-smartd.service
          if systemctl is-active --quiet smartmontools.service; then echo "::error::stock smartmontools.service is still running next to hl-smartd"; exit 1; fi

      # persistence-auditor auto-accepts a unit file only when its path AND full sha256 match
      # this manifest, so units CI installed stop reading as "NEW persistence entry" forever
      # (434 of 806 warnings in Oct-Nov 2026 were exactly that). Hashes come from the git
      # checkout, not the installed copies; the file is root-owned 0644 outside the Samba
      # share, and the auditor ignores it if anyone but root can write it. A unit edited by
      # hand after a deploy no longer matches and is flagged as before.
      - name: Record the unit files this deploy installed (persistence-auditor manifest)
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          echo "# installed by opti-deploy.yml at $GITHUB_SHA on $(date -u +%FT%TZ)" > "$tmp"
          for f in "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.service \
                   "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.timer \
                   "$GITHUB_WORKSPACE"/homelab/tools/automation/*.service \
                   "$GITHUB_WORKSPACE"/homelab/tools/automation/*.timer; do
            if [ -f "$f" ]; then echo "$(sha256sum "$f" | cut -d' ' -f1)  /etc/systemd/system/$(basename "$f")" >> "$tmp"; fi
          done
          for f in "$GITHUB_WORKSPACE"/homelab/hosts/opti/systemd/*.d/*.conf; do
            if [ -f "$f" ]; then echo "$(sha256sum "$f" | cut -d' ' -f1)  /etc/systemd/system/$(basename "$(dirname "$f")")/$(basename "$f")" >> "$tmp"; fi
          done
          sudo install -D -m 0644 -o root -g root "$tmp" /etc/homelab/deployed-units.sha256
          rm -f "$tmp"
          echo "$(grep -vc '^#' /etc/homelab/deployed-units.sha256) unit files recorded"

      # The auditor's baseline used to live under HL_DATA_DIR on /srv/red/fs, which Samba
      # exports as \\opti\red - anyone with share write access could edit it and accept
      # their own persistence. /srv/red/opsdb is on the pool but not exported (it already
      # holds homelab.db). ptm, not root: the collector runs as ptm and must write it.
      - name: Persistence-auditor state dir (not on the Samba share)
        run: |
          sudo install -d -o ptm -g ptm -m 0700 /srv/red/opsdb/hl-agents-state /srv/red/opsdb/hl-agents-state/persistence

      # Secrets are never in the repo, but their owner/mode is (audit 2026-11-09: hl-agents.env,
      # the compose .env, the Vaultwarden key and the TLS keys were 777/664, inherited from the
      # old Pi). Before the restarts on purpose, so a too-tight entry fails this deploy loudly.
      - name: Enforce secret file permissions
        run: sudo bash "$GITHUB_WORKSPACE/homelab/tools/automation/enforce-secret-perms.sh" "$GITHUB_WORKSPACE/homelab/hosts/opti/secret-perms.conf"

      - name: Restart the dispatcher (it runs from the synced snapshot)
        run: |
          sudo systemctl restart hl-agent-dispatcher
          sleep 2
          systemctl is-active hl-agent-dispatcher

      # Until 2026-11-09 opti's hl-arch-agent was copied to /usr/local/bin by hand (rpi and
      # noblenumbat still are). Restarts only when a file changed or the listener is not on
      # the address its drop-in (systemd/hl-arch-agent.service.d/10-bind.conf) asks for.
      - name: Install hl-arch-agent (opti)
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/homelab/tools/arch-agent"
          changed=0
          for f in hl-arch-agent.py monitor.py; do
            if ! cmp -s "$src/$f" "/usr/local/bin/$f"; then sudo install -m 0755 "$src/$f" "/usr/local/bin/$f"; changed=1; fi
          done
          want=$(sed -n 's/^Environment=HL_ARCH_AGENT_BIND=//p' "$GITHUB_WORKSPACE/homelab/hosts/opti/systemd/hl-arch-agent.service.d/10-bind.conf")
          ss -ltnH 'sport = :8787' | grep -qF "${want}:8787" || changed=1
          if [ "$changed" = 1 ]; then sudo systemctl restart hl-arch-agent; sleep 3; fi
          systemctl is-active hl-arch-agent
          ss -ltnH 'sport = :8787' | grep -F "${want}:8787"

      # LLMNR off (audit S-4). Restarts resolved only when the drop-in changed.
      - name: Install systemd-resolved drop-ins
        run: |
          set -euo pipefail
          for f in "$GITHUB_WORKSPACE"/homelab/hosts/opti/resolved.conf.d/*.conf; do
            dst="/etc/systemd/resolved.conf.d/$(basename "$f")"
            if ! cmp -s "$f" "$dst"; then sudo install -D -m 0644 "$f" "$dst"; sudo systemctl restart systemd-resolved; sleep 2; fi
          done
          systemctl is-active systemd-resolved
          if ss -lnH 'sport = :5355' | grep -q .; then echo "::error::LLMNR still listening on 5355"; exit 1; fi

      - name: Restart homelab-db services (they also run from the synced snapshot)
        run: |
          sudo systemctl restart homelab-db homelab-db-vitals
          sleep 2
          systemctl is-active homelab-db homelab-db-vitals

      - name: Verify timers
        run: |
          sudo systemctl enable --now homelab-docs.timer homelab-agentic-docs.timer homelab-autoupdate.timer homelab-autoreboot.timer homelab-db-ingest.timer homelab-vault-dump.timer
          # Cold copy retired 2026-09-24 (attic disks removed). Prune what earlier deploys installed;
          # the unit files stay in git under homelab/hosts/opti/retired/.
          sudo systemctl disable --now homelab-coldcopy.timer 2>/dev/null || true
          sudo rm -f /etc/systemd/system/homelab-coldcopy.service /etc/systemd/system/homelab-coldcopy.timer /usr/local/bin/homelab-coldcopy.sh
          sudo systemctl daemon-reload
          # Pool red is scrubbed once a month by Debian's /etc/cron.d/zfsutils-linux (2nd Sunday;
          # its scrub resumes after a reboot). The packaged timer was a second, hand-enabled scrub
          # whose ExecStop pauses the scrub on shutdown. Stops only the timer, never a running scrub.
          sudo systemctl disable --now zfs-scrub-monthly@red.timer 2>/dev/null || true
          systemctl list-timers homelab-docs.timer homelab-agentic-docs.timer homelab-db-ingest.timer homelab-vault-dump.timer --no-legend --no-pager

      # Collectors run on systemd timers since 2026-09-24 (they were a GitHub cron in
      # homelab-agents.yml, which fired ~5 of 48 runs a day). Keep these lists in sync
      # with SCHEDULED_AGENTS in homelab/hosts/opti/agent-dispatcher.py.
      - name: Enable collector timers
        run: |
          set -e
          FREQUENT="homelab-doctor network-report"
          DAILY="journald-hunter persistence-auditor hardware-report software-inventory"
          units=""
          for a in $FREQUENT; do units="$units hl-collector-frequent@$a.timer"; done
          for a in $DAILY;    do units="$units hl-collector-daily@$a.timer"; done
          sudo systemctl enable --now $units
          systemctl list-timers 'hl-collector-*' --no-legend --no-pager

      # Quotas, reservations and snapshot opt-outs for pool red live in the repo (audit H-3,
      # 2026-11-09). The script only sets/inherits properties where the live value differs -
      # it never creates or destroys anything. Last on purpose: a failure here (missing
      # dataset, quota below current use) must not block the restarts above.
      - name: ZFS dataset properties (pool red)
        run: |
          sudo bash "$GITHUB_WORKSPACE/homelab/hosts/opti/zfs/apply-zfs-properties.sh" \
                    "$GITHUB_WORKSPACE/homelab/hosts/opti/zfs/red-properties.tsv"
          sudo zfs get -H -o name,property,value,source quota,reservation,com.sun:auto-snapshot \
               red/media red/docker red/docker-apps red/opsdb
