#rpi-deploy-yml
name: Deploy RPI Stack

# 2026-09-09: trimmed to an appliance deploy. rpi runs only Pi-hole + a Dozzle
# agent now; the app tier and its whole build pipeline moved to
# .github/workflows/opti-apps-deploy.yml. There is nothing to compile here any
# more, so the GitHub-hosted frontend build job and every bot/webapp/notes copy
# step are gone.
#
# `--remove-orphans` on the up is what actually retires the migrated containers
# from this host the first time this runs.

on:
  push:
    branches: [main]
    paths:
      - "homelab/hosts/rpi/docker-compose.yml"
      - ".github/workflows/rpi-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, ARM64]   # pin to the Pi; bare 'self-hosted' also matches opti (x86_64)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file
        run: cp "$GITHUB_WORKSPACE/homelab/hosts/rpi/docker-compose.yml" /srv/docker/compose/docker-compose.yml

      - name: Validate compose before touching containers
        working-directory: /srv/docker/compose
        run: docker compose config --quiet

      - name: Pull latest images
        working-directory: /srv/docker/compose
        run: docker compose pull

      - name: Bring stack up
        working-directory: /srv/docker/compose
        run: docker compose up -d --remove-orphans

      - name: Verify DNS actually answers
        # The 2026-09-09 rebuild shipped a Pi-hole whose container was "running" and
        # self-reported healthy while answering nothing at all. Container state is
        # not evidence — query it.
        run: |
          sleep 8
          dig +short +time=3 +tries=2 google.com @127.0.0.1 | grep -qE '^[0-9]+\.' \
            || { echo "Pi-hole is up but not resolving"; docker logs pihole --tail 30; exit 1; }
          echo "DNS OK"
