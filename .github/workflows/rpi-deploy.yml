#rpi-deploy-yml
name: Deploy RPI Stack

on:
  push:
    branches: [main]
    paths:
      - "homelab/hosts/rpi/docker-compose.yml"
      - "homelab/hosts/rpi/webapp/**"
      - "homelab/hosts/rpi/nginx-wg.conf"
      - "homelab/hosts/rpi/notes-app/**"
      - "homelab/hosts/rpi/discord-weather/**"
      - "homelab/hosts/rpi/discord-healthdigest/**"
      - "homelab/hosts/rpi/discord-jellyfin/**"
      - "homelab/hosts/rpi/discord-sports/**"
      - "homelab/hosts/rpi/discord-hltv/**"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # The v2 frontend is built on GitHub-hosted ubuntu (fast, free on a public repo)
  # and artifact-passed to the Pi — a Vite+React production build on a Pi 4 is
  # minutes of swap-thrash. Output is plain static files, so where it builds is
  # irrelevant to what deploys.
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # matches node:lts-alpine in the webapp container (v24)
          cache: npm
          cache-dependency-path: homelab/hosts/rpi/webapp/frontend/package-lock.json

      - name: Build (tsc + vite)
        working-directory: homelab/hosts/rpi/webapp/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: homelab/hosts/rpi/webapp/frontend/dist
          retention-days: 3

  deploy:
    needs: build-frontend
    runs-on: [self-hosted, ARM64]   # pin to the Pi (ARM64); bare 'self-hosted' also matched opti (x86_64)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch built frontend
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: homelab/hosts/rpi/webapp/frontend/dist

      - name: Copy compose file
        run: |
          cp "$GITHUB_WORKSPACE/homelab/hosts/rpi/docker-compose.yml" /srv/docker/compose/docker-compose.yml

      - name: Sync webapp and nginx config
        # rsync --delete (was cp -r): removed/renamed files must disappear on the Pi
        # too — cp left the pre-redesign frontend at the served root forever, and the
        # v2 app's content-hashed bundles would otherwise accumulate unboundedly.
        # backend/node_modules is excluded so the warm install survives (the 2-3s
        # restart window the compose command comment relies on).
        run: |
          mkdir -p /srv/docker/compose/webapp
          rsync -a --delete --exclude 'backend/node_modules' \
            "$GITHUB_WORKSPACE/homelab/hosts/rpi/webapp/" /srv/docker/compose/webapp/
          cp "$GITHUB_WORKSPACE/homelab/hosts/rpi/nginx-wg.conf" /srv/docker/compose/nginx-wg.conf

      - name: Copy notes-app
        run: |
          mkdir -p /srv/docker/compose/notes-app/api
          mkdir -p /srv/docker/compose/notes-app/web
          cp -r "$GITHUB_WORKSPACE/homelab/hosts/rpi/notes-app/api/." /srv/docker/compose/notes-app/api/
          cp -r "$GITHUB_WORKSPACE/homelab/hosts/rpi/notes-app/web/." /srv/docker/compose/notes-app/web/

      - name: Copy discord bots
        # must run before "Bring stack up" — compose references these build contexts
        run: |
          for bot in discord-weather discord-healthdigest discord-jellyfin discord-sports discord-hltv; do
            mkdir -p "/srv/docker/compose/$bot"
            cp -r "$GITHUB_WORKSPACE/homelab/hosts/rpi/$bot/." "/srv/docker/compose/$bot/"
          done

      - name: Pull latest images
        working-directory: /srv/docker/compose
        run: docker compose pull

      - name: Bring stack up
        working-directory: /srv/docker/compose
        run: docker compose up -d --remove-orphans

      - name: Restart webapp to pick up code changes
        working-directory: /srv/docker/compose
        run: docker compose restart webapp

      - name: API smoke against the restarted backend
        # Runs INSIDE the webapp container (the Pi host has no node). Hits Fastify
        # directly on :3000 and compares against the committed v1 baseline — a missing
        # route or a response that lost fields marks the deploy red. Rollback stays
        # manual (see webapp/ROLLBACK.md), per house style.
        working-directory: /srv/docker/compose
        run: |
          sleep 8   # let npm install + boot finish inside the container
          docker compose exec -T webapp node /app/scripts/smoke-api.mjs \
            --base http://127.0.0.1:3000 --compare /app/scripts/smoke-baseline.json

      - name: Build and restart notes-api
        working-directory: /srv/docker/compose
        run: |
          docker compose build notes-api
          docker compose up -d notes-api

      - name: Build and restart discord bots
        working-directory: /srv/docker/compose
        run: |
          docker compose build discord-weather discord-healthdigest discord-jellyfin discord-sports discord-hltv
          docker compose up -d discord-weather discord-healthdigest discord-jellyfin discord-sports discord-hltv

      - name: Restart nginx to pick up config changes
        working-directory: /srv/docker/compose
        run: docker compose restart nginx-webapp