[package]
name = "ptmonitor2"
version = "2.0.0"
edition = "2021"
description = "PTMonitor 2 - native Win32/Direct2D system monitor widget for Windows 11"
build = "build.rs"
publish = false

[lib]
name = "ptmonitor2"
path = "src/lib.rs"

[[bin]]
name = "ptmonitor2"
path = "src/main.rs"

[dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Registry", "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_Storage_FileSystem",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Accessibility",
] }
windows-numerics = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-winres = "=0.3.5"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
