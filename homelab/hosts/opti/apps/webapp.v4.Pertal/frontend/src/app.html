<!doctype html>
<html lang="en" data-family="gruvbox" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2021" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pertal" />
    <title>Pertal</title>
    <script>
      // Theme before first paint (see src/lib/theme.svelte.ts for the same logic at runtime).
      (function () {
        var d = document.documentElement;
        try {
          var family = localStorage.getItem('pertal-theme-family') || 'gruvbox';
          var mode = localStorage.getItem('pertal-theme-mode') || 'system';
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          d.dataset.family = family === 'github' ? 'github' : 'gruvbox';
          d.dataset.mode = mode === 'light' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
