# /etc/homelab/smartd.conf — opti's smartd config, read by hl-smartd.service.
#
# Source of truth: homelab/hosts/opti/smartd/smartd.conf, installed by
# .github/workflows/opti-deploy.yml. Edits on the host are overwritten on the next push.
#
# Why not /etc/smartd.conf: OpenMediaVault owns that file (its salt state rewrites it
# from its own database) and, with SMART disabled in OMV, also stops and disables the
# stock smartmontools.service whenever that state is applied. So smartd runs as our own
# unit with our own config, and SMART monitoring stays OFF in the OMV UI. Turning it on
# there would start a second smartd. See runbooks/12-opti-disk-alerting.md.
#
# Disks are named by /dev/disk/by-id: device letters on opti are NOT stable (the boot
# disk was sda until 2026-09-10, sdb since).
#
# Every warning runs the -M exec hook, which pushes through homelab/tools/notify.py.
# smartd's default is to warn ONCE per problem type per disk (remembered in its state
# files across restarts), so a standing problem does not re-page every 30 minutes.
#
# Schedule: short self-test daily 02:00, long self-test Saturdays 03:00.

DEFAULT -m root -M exec /usr/local/bin/hl-smartd-alert.sh

# Pool disk — WD Red Plus 4 TB, the only disk under ZFS pool red (no second copy anywhere).
# Full monitoring: health, usage-attribute failures, ATA error log, self-test failures,
# pending (197) and offline-uncorrectable (198) sectors, temperature; reallocated (5)
# raw changes are logged.
/dev/disk/by-id/ata-WDC_WD40EFZZ-68CPAN0_WD-WX32D163WV1V -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,50,55 -R 5

# Boot disk — Seagate ST500DM002, OS only. Its reallocated count (288 on 2026-11-09) is an
# accepted risk (rule 01-homelab-context.md), so this line pages ONLY on rule 01's triggers:
# overall health failing (-H), pending sectors (-C 197), offline-uncorrectable sectors
# (-U 198), plus a failed self-test (-l selftest) and critical temperature (-W). It does
# not watch the ATA error log or usage attributes, and reallocated changes are logged
# (-R 5), never paged. The "+20 reallocated at once" trigger cannot be expressed in smartd;
# it stays with the daily hardware-report collector.
/dev/disk/by-id/ata-ST500DM002-1BD142_Z6E9H7VE -H -l selftest -C 197 -U 198 -t -o on -S on -s (S/../.././02|L/../../6/03) -W 4,50,55 -R 5

# Hitachi 640 GB laptop disk (NTFS, mounted /srv/dev-disk-by-uuid-C682C2DE82C2D1DB).
# Not part of the pool; monitored as before, now by id instead of letter.
/dev/disk/by-id/ata-Hitachi_HTS547564A9E384_110926J2380053CXKRHC -a -o on -S on -s (S/../.././02|L/../../6/03) -W 4,50,55 -R 5
