# opti only: listen on the LAN address, not 0.0.0.0 (audit S-4, 2026-11-09).
# Every client - the v3/v4 dashboards (lib/hosts.js) and homelab-db-vitals
# (vitals_logger.py) - uses http://192.168.1.11:8787. rpi and noblenumbat keep the
# default. Installed by opti-deploy.yml's drop-in loop; the agent itself is installed
# by its "Install hl-arch-agent" step, which restarts it when this changes.
[Service]
Environment=HL_ARCH_AGENT_BIND=192.168.1.11
