# opti: LLMNR off (audit S-4, 2026-11-09). Nothing on the LAN resolves opti by LLMNR:
# Windows gets it from Pi-hole DNS (the P: drive uses opti.lan), rpi has LLMNR off and
# noblenumbat uses DNS. mDNS stays with avahi (OMV's 99-openmediavault-mdns.conf).
# Installed by opti-deploy.yml, which restarts systemd-resolved only when this changes.
[Resolve]
LLMNR=no
