# Secret files on opti: <owner:group> <mode> <path or glob>.
# Applied on every push by opti-deploy.yml via homelab/tools/automation/enforce-secret-perms.sh
# (non-recursive; never reads contents). Audit 2026-11-09, finding 3: these were 777/664.
# Check who reads a file before loosening or tightening an entry.

# systemd reads EnvironmentFile= as root (PID 1) before dropping to User=ptm, so root-only is
# enough for every hl-*/homelab-* unit. No container mounts it and no script sources it.
root:root 600 /etc/hl-agents.env

# docker compose reads it as ptm (the opti runner user, opti-apps-deploy.yml);
# homelab-vault-dump runs as root.
ptm:ptm   600 /srv/docker/compose/.env

# The directory itself only: it was 777, which let any local user swap .env or the compose file.
ptm:ptm   755 /srv/docker/compose

# Live Vaultwarden JWT signing key. The bitwarden container runs as root.
ptm:ptm   600 /srv/docker/compose/vaultwarden-data/rsa_key.pem

# Older copies of the bitwarden TLS key (nginx-bitwarden mounts the pool copy below).
ptm:ptm   600 /srv/docker/compose/certs/*-key.pem*

# TLS private keys that nginx-webapp / nginx-bitwarden bind-mount read-only (nginx's master
# process is root), and the homelab CA key, which is only used by hand as ptm to sign certs.
ptm:users 600 /srv/red/fs/ptm/certs/*-key.pem*
ptm:users 600 /srv/red/fs/ptm/certs/ca/*-key.pem
