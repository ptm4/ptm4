# samba-red.conf — the [red] share on opti. HAND-MANAGED; this file is the source of truth.
#
# Deployed to: /etc/homelab/samba-red.conf on opti
#   sudo mkdir -p /etc/homelab
#   sudo cp samba-red.conf /etc/homelab/samba-red.conf
#   sudo smbcontrol all reload-config
#
# WHY IT LIVES OUTSIDE /etc/samba:
#   OpenMediaVault owns /etc/samba/smb.conf and regenerates it from its own config DB, so
#   anything hand-written there is silently discarded on the next commit. (That is exactly
#   what happened before: a bare `path = /srv/pool/` was appended as the last line of
#   smb.conf to make the mergerfs union shareable, and it survived only because Samba
#   applies last-wins on duplicate parameters. Any OMV commit would have dropped it and
#   quietly repointed the share at half the data.)
#
#   OMV has no filesystem backend for ZFS, so it cannot model this share at all. Instead of
#   fighting that, we keep OMV's directory purely OMV's and put our config here. The bridge
#   is a single line in OMV's SMB "Extra options" field (Services -> SMB/CIFS -> Settings):
#
#       include = /etc/homelab/samba-red.conf
#
#   That value is stored in OMV's config.xml and re-emitted verbatim into [global] on every
#   regeneration (see /srv/salt/omv/deploy/samba/files/global.j2), so OMV maintains the link
#   to this file for us. Nothing here is ever overwritten.
#
# Edit via the webapp (Samba tab) or here + redeploy. Webapp edits do not persist to the
# repo — commit them.

[red]
    path = /srv/red/fs
    comment = opti primary storage (ZFS pool `red`)
    browseable = yes
    read only = no
    guest ok = no
    valid users = ptm
    force group = users
    create mask = 0664
    directory mask = 2775

    # Expose ZFS snapshots as Windows "Previous Versions" / macOS versions, so a file can be
    # restored from a snapshot straight from the file manager. zfs-auto-snapshot names its
    # snapshots zfs-auto-snap_<label>-<timestamp>, which is what shadow:format matches.
    vfs objects = shadow_copy2
    shadow:snapdir = .zfs/snapshot
    shadow:sort = desc
    shadow:localtime = no
    shadow:format = zfs-auto-snap_%S-%Y-%m-%d-%H%M
