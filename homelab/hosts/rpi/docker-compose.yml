#compose — rpi, network appliance
#
# 2026-09-09: rpi is now a pure NVA. The whole app tier (dashboard, 5 Discord bots,
# hltv-api, notes, Uptime Kuma, Dozzle, Vaultwarden + MariaDB) moved to opti — see
# homelab/hosts/opti/docker-compose.apps.yml and
# homelab/agentic/runbooks/10-rpi-rebuild-and-app-tier-migration.md.
#
# What stays here, and why: DNS is the service every other host depends on, so it
# must NOT live on the same box as storage/compute. Keeping it on the Pi means
# rebooting opti (kernel updates, the eventual boot-disk replacement) never takes
# LAN name resolution down with it. A Pi 4 also draws ~3-5W against the OptiPlex's
# ~35-40W, and Pi-hole is a near-zero-load workload — this is the machine matched
# to the job. Before adding anything else here, read the "what belongs on rpi"
# section of the runbook: this box earns its reliability by staying boring.
#
# Host prerequisite (enforced by the rebuild preseed, do not undo): systemd-resolved
# is DISABLED with a hand-managed /etc/resolv.conf. Its TCP stub on 127.0.0.53:53
# blocks FTL's wildcard TCP bind on :53 and silently kills DNS.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    logging: *default-logging
    network_mode: "host"          # Host mode required for DNS
    environment:
      TZ: "America/New_York"
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASSWORD}
      FTLCONF_dns_upstreams: "192.168.1.1;1.1.1.1"
    volumes:
      - pihole_data:/etc/pihole
      - dnsmasq_data:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN                  # DHCP capability retained; DHCP itself is OFF
                                   # (the router serves it) — see runbook 02.
      - SYS_NICE                   # Suppress FTL process priority warning

  # Ships this host's container logs to the Dozzle instance on opti, so the
  # dashboard's #logs tab still shows rpi after the migration.
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    restart: unless-stopped
    logging: *default-logging
    command: agent
    ports:
      - "${RPI_IP}:7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pihole_data:
  dnsmasq_data:
