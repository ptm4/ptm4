<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22272e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on the phone over WireGuard. No service worker on purpose:
         this is a live-data app, an offline cache would only ever show stale state. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket" />
    <title>Pert's Pocket</title>
    <script>
      // Theme before first paint — same localStorage key as every legacy page so the
      // whole dashboard (v2, /legacy, standalone pages) flips together.
      (function () {
        try {
          var t = localStorage.getItem('arch-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
