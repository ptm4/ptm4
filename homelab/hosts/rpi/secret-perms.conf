# Secret files on rpi: <owner:group> <mode> <path or glob>.
# Applied by rpi-deploy.yml via homelab/tools/automation/enforce-secret-perms.sh
# (non-recursive; never reads contents). Audit 2026-11-09, finding 3: these were 777.

# docker compose reads it as ptm (the ARM64 runner user) to interpolate PIHOLE_WEB_PASSWORD and
# RPI_IP; nothing mounts it. root:root would break rpi-deploy's `docker compose config`.
ptm:ptm 600 /srv/docker/compose/.env

# The directory itself only: it was 777, which let any local user swap .env or the compose file.
ptm:ptm 755 /srv/docker/compose
