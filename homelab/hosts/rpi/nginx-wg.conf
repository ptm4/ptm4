server {
    listen 443 ssl;
    server_name webapp.rpi.lan webapp.rpi;

    ssl_certificate     /etc/ssl/certs/webapp.crt;
    ssl_certificate_key /etc/ssl/private/webapp.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Plain-HTTP hits on this TLS port raise nginx's internal 497; without this they
    # surface as a bare "400 plain HTTP request was sent to HTTPS port". $host carries
    # no port, so the host-side mapping (8443 -> container 443) must be re-appended.
    error_page 497 =301 https://$host:8443$request_uri;

    # A deploy restarts the webapp container (a few seconds of npm + boot) while nginx
    # outlives it; the bare 502s that produced read as "the site is flapping",
    # especially on a phone over WireGuard. The holding page below self-retries every
    # 3s. It is wired ONLY into `location /` (page loads + generic reads) — the
    # /api/agents and /api/llama locations keep their bare 502s on purpose: the
    # frontend's self-restart/expected-disconnect logic keys on those status codes,
    # and real 502 JSON from the backend must reach it unmodified.
    location = /_restarting.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="3"><title>restarting…</title><body style="font-family:system-ui;background:#0d1117;color:#c9d1d9;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h2>Dashboard is restarting…</h2><p>Usually a deploy landing — retrying every 3s automatically.</p></div>';
    }

    location /notes {
        proxy_pass http://notes-api:3002/notes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Local LLM queries (ask/chat) can legitimately take minutes on a cold prompt
    # cache — nginx's default 60s read timeout cuts these off before the backend's
    # own (longer) fetch timeout to llama-server has a chance to finish, producing a
    # 504 even when the query would have succeeded. Scoped here rather than raising
    # it for the whole webapp.
    # NB: no trailing slash on these two location prefixes. With one, nginx 301s the
    # slash-less URL (which the frontend fetches) and builds the Location from its
    # *container-internal* listen port 443 — sending browsers to Vaultwarden's nginx.
    location /api/llama {
        proxy_pass http://webapp:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Container image updates (pull + recreate, via the per-host arch agents) have the
    # same problem /api/llama/ does: a registry pull legitimately runs for minutes, and
    # the default 60s read timeout turns a succeeding update into a 504. The backend
    # caps the agent call at 220s and the browser at 230s, so this must sit above both.
    # Restart-container shares this location and is unaffected — it self-caps at 55s.
    location /api/agents {
        proxy_pass http://webapp:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Dozzle (container logs), served same-origin so the dashboard's #logs tab can
    # iframe it — a plain http://rpi.lan:9999 iframe inside this https page would be
    # blocked as mixed content. Dozzle runs with DOZZLE_BASE=/dozzle to match.
    # Log streaming is SSE: buffering must be off and the read timeout generous, or
    # the stream stalls at nginx. No trailing slash — same 301/port reasoning as above.
    location /dozzle {
        proxy_pass http://dozzle:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://webapp:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only nginx-generated errors (upstream refused/timed out) land here —
        # proxy_intercept_errors stays off, so backend-authored responses pass through.
        error_page 502 503 504 /_restarting.html;
    }
}
