<!doctype html>
<html lang="en" data-theme="dark" data-accent="yellow">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2021" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable on the phone. No service worker on purpose: this is a live-data app,
         an offline cache would only ever show stale state. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket" />
    <title>Pert's Pocket</title>
    <script>
      // Theme + accent before first paint. Same localStorage key ('arch-theme') as every
      // legacy/standalone page so the whole dashboard flips together; 'pocket-accent' is
      // v3-only (gruvbox yellow / orange / aqua).
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('arch-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          d.dataset.theme = t;
          var a = localStorage.getItem('pocket-accent');
          if (a === 'yellow' || a === 'orange' || a === 'aqua') d.dataset.accent = a;
        } catch (e) { d.dataset.theme = 'dark'; }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
